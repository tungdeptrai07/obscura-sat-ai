<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ObscuraSat EarthWatch — Satellite Spectral &amp; Change Detection</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #07131f; color: #e2e8f0; max-width: 820px; margin: 2rem auto; padding: 0 1.25rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 0.75rem; margin: 1rem 0; }
    .card { background: #0f2236; border: 1px solid #1e3a5f; border-radius: 8px; padding: 0.85rem; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 0.25rem; }
    input { width: 100%; padding: 0.45rem; border-radius: 6px; border: 1px solid #334155; background: #07131f; color: #f8fafc; box-sizing: border-box; }
    .badge { display: inline-block; padding: 0.35rem 0.7rem; border-radius: 999px; background: #0284c7; color: #fff; font-weight: 600; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>ObscuraSat EarthWatch</h1>
  <p>Interactive multi-spectral satellite index analyzer (NDVI, NDWI, NDBI) for Earth Observation anomaly &amp; land-cover change detection.</p>
  <div class="grid">
    <div class="card"><label>Red Band (B4)</label><input id="red" type="number" step="0.01" value="0.18" /></div>
    <div class="card"><label>Green Band (B3)</label><input id="green" type="number" step="0.01" value="0.16" /></div>
    <div class="card"><label>NIR Band (B8)</label><input id="nir" type="number" step="0.01" value="0.54" /></div>
    <div class="card"><label>SWIR Band (B11)</label><input id="swir" type="number" step="0.01" value="0.24" /></div>
  </div>
  <div class="grid" id="out"></div>
  <div id="status"></div>
  <script>
    const ratio = (a, b) => (a + b) === 0 ? 0 : +((a - b) / (a + b)).toFixed(4);
    function update() {
      const r = +document.getElementById('red').value;
      const g = +document.getElementById('green').value;
      const n = +document.getElementById('nir').value;
      const s = +document.getElementById('swir').value;
      const ndvi = ratio(n, r), ndwi = ratio(g, n), ndbi = ratio(s, n);
      document.getElementById('out').innerHTML = `
        <div class="card"><strong>NDVI (Vegetation)</strong><div>${ndvi}</div></div>
        <div class="card"><strong>NDWI (Water)</strong><div>${ndwi}</div></div>
        <div class="card"><strong>NDBI (Built-up)</strong><div>${ndbi}</div></div>`;
      const cls = ndwi > 0.1 ? 'Surface Water' : ndvi > 0.35 ? 'Dense Vegetation' : ndbi > 0.05 ? 'Urban / Built-up' : 'Barren / Sparse';
      document.getElementById('status').innerHTML = `<span class="badge">Land Cover: ${cls}</span>`;
    }
    ['red','green','nir','swir'].forEach(id => document.getElementById(id).addEventListener('input', update));
    update();
  </script>
</body>
</html>
